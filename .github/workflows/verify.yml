name: verify

# 门槛只做十件事：描述文件规格漂移、契约自测（每个 provider 过同一把尺子）、bitable 只读实跑闸门
# （默认不带 -Live：只跑分页/退出码离线自测，真读打印 SKIP，缺凭据不判红）、停跑调度语义（intervalMin
# 为 0 / 空 / 负数不进 due，防止已停项目被每 60 分钟唤醒）、csv-file 离线自测、
# command 离线自测（mock 命令，无凭据无网络，CI 可真跑）、跨仓 item 契约同源校验（兄弟仓 dsh-patrol
# 稀疏 checkout 后真跑，不再是 SKIP）、安装漂移自检的自证段、密钥卫生、发布归档自证（内容清单 /
# 逐条哈希 / 禁入模式 / 用户改动排除 / 产物密钥扫描）。
# 除「稀疏 checkout 公开兄弟仓 yangpeng366/dsh-patrol 的 schemas/」这一条取数动作外，全部离线：
# 不装依赖、不跑网络用例、不需要任何 secret（公开仓用默认 GITHUB_TOKEN 即可）。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: pwsh gates (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 保持仓库原样换行，避免 CSV 与源码被 autocrlf 改写后与本地不一致
          fetch-depth: 1

      - name: Show PowerShell version
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          $PSVersionTable.PSEdition

      - name: Adapter spec drift check
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-adapter-spec.ps1

      - name: Adapter contract test (all providers)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/adapter-contract-test.ps1

      # 可选实跑闸门：默认无 -Live 且无凭据，只跑分页/非零退出的离线自测并打印 SKIP，exit 0。
      # CI 不装 lark-cli、不配飞书 secret，也绝不因为缺凭据判红；真读由本机人工 -Live 触发。
      - name: bitable live gate (default SKIP without credentials)
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-bitable-live.ps1

      # 停跑语义闸门：intervalMin 为 0 / 空 / 缺列 / 负数一律不进 due（表数据里 0 值行 = 停跑）。
      # 自带 3 个变异副本自证：把「跳过」逻辑改回 <=0 -> 60 必须判红，否则说明闸门自己失效了。
      - name: Disabled scheduling gate (0 / empty interval = parked)
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-disabled-scheduling.ps1

      # 发布归档自证先于兄弟仓 checkout：actions/checkout 会把 dsh-patrol/ 写进当前工作树，
      # 而发布脚本把任何未跟踪文件视为“不应进包”并 fail-closed。
      - name: Release archive (build + self-verify)
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP 'release'
          pwsh -NoProfile -File scripts/build-release.ps1 -OutputDirectory $releaseDir

      # 安装漂移门禁的自证段：%TEMP% 里现造 git 仓，断言干净副本 PASS / 篡改一字节 FAIL 并点名 /
      # 缺文件 FAIL / 运行态文件不误报不删除 / BOM 报出 / 以 HEAD 为基准（工作区脏不算漂移）/ 不可读 FAIL。
      # 这里不拿发布归档当「安装目录」实检：本门禁基准是 HEAD blob（逐字节），而 windows-latest 的
      # core.autocrlf 可能把工作区与归档写成 CRLF，两者天然不等；实检是运维动作，命令见
      # docs/releasing.md §3.1（在 HEAD 字节的干净副本上实测 checked=53 ok=53 fail=0）。
      - name: Install drift gate (self-test)
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-install-drift.ps1

      # 跨仓同源校验（真闸门，两条）：
      # 1) 静态：两份 schemas/item.schema.json 逐键等价；
      # 2) 动态：同一份 fixture 行喂本仓 Convert-BitableRowToItem 与兄弟仓 bitable.ts+normalizeItem，逐字段相等。
      #
      # 旧版本这里只 checkout 了 patrol-scaffold 一个仓，脚本默认查找的 ../dsh-patrol/schemas/
      # item.schema.json 在 CI 上必然不存在，于是这步永远打印 SKIP 并 exit 0——闸门形同虚设。
      # 现在改为：先把兄弟仓 yangpeng366/dsh-patrol 稀疏 checkout 到 workspace 内的 dsh-patrol/
      # （静态闸门要 schemas，e2e 闸门要 src，都按 fetch-depth 1 取），再用显式路径指过去。
      # 显式给路就一定要读到文件，读不到直接 FAIL（两个脚本对「显式指路指空」都判红），
      # 所以 CI 上它们是真闸门。公开仓用默认 GITHUB_TOKEN、不需要新增 secret。
      - name: "Checkout dsh-patrol (cross-repo gate input: schema + source)"
        uses: actions/checkout@v4
        with:
          repository: yangpeng366/dsh-patrol
          path: dsh-patrol
          sparse-checkout: |
            schemas
            src
          fetch-depth: 1

      - name: Item contract parity (cross-repo; real gate)
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-item-contract-parity.ps1 -OtherSchema ./dsh-patrol/schemas/item.schema.json

      # e2e 对拍直接用 node 跑兄弟仓的 .ts 原码（--experimental-strip-types，Node >= 22.6）。
      # 不装任何依赖：右侧只 import node 内建模块 + 同仓 src，不碰 pnpm / 构建产物。
      - name: Setup Node (strip-types runner for cross-repo e2e)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Item parity e2e (cross-repo; real gate)
        shell: pwsh
        run: |
          node --version
          pwsh -NoProfile -File tests/verify-item-parity-e2e.ps1 -DshRepo ./dsh-patrol

      - name: csv-file adapter self-test
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-csv-file-adapter.ps1

      # command 适配器的离线自测：fixture 是仓内 mock 命令（不联网、不读凭据、输出确定性），
      # 所以这条在 CI 上是真跑而不是 SKIP。它同时断言负面分支（退出码 / 超时 / banner / fieldMap 拼错）
      # 与「与 local-json 归一后 item 形状一致」。
      - name: command adapter self-test
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-command-adapter.ps1

      - name: Secret hygiene gate
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-no-secrets.ps1

      # 提示词决策层的离线自测：提示词本体 + 解析器 + 三类回答（合规 / 缺字段 / 多行杂音）。
      # 不联网、不调模型、不读凭据，所以这条在 CI 上是真跑而不是 SKIP。
      - name: Decision prompt self-test
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-decision-prompt.ps1

