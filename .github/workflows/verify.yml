name: verify

# 门槛只做五件事：描述文件规格漂移、契约自测（每个 provider 过同一把尺子）、csv-file 离线自测、
# 跨仓 item 契约同源校验（CI 上 SKIP，原因见该步骤注释）、密钥卫生。
# 全部离线：不装依赖、不联网取数据、不需要任何凭据。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: pwsh gates (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 保持仓库原样换行，避免 CSV 与源码被 autocrlf 改写后与本地不一致
          fetch-depth: 1

      - name: Show PowerShell version
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          $PSVersionTable.PSEdition

      - name: Adapter spec drift check
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-adapter-spec.ps1

      - name: Adapter contract test (all providers)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/adapter-contract-test.ps1

      # 跨仓同源校验：本仓 schemas/item.schema.json 与 dsh-patrol/schemas/item.schema.json
      # 必须逐键等价（比较口径见 tests/verify-item-contract-parity.ps1 文件头）。
      #
      # 为什么 CI 上这步是 SKIP 而不是 FAIL：本 workflow 只 checkout 了 patrol-scaffold 一个仓，
      # 脚本默认查找的 ../dsh-patrol/schemas/item.schema.json 必然不存在。脚本对
      # 「按相对位置推出来的路径缺失」打印 SKIP 并 exit 0；只有「显式 -OtherSchema 指了但不存在的
      # 路径」才 exit 1（手滑不是环境不具备）。这条口径与既有步骤一致：
      # verify-no-secrets.ps1（文件不在本 checkout => SKIP）、adapter-contract-test.ps1
      # （缺凭据/配置 => SKIP）——SKIP 只表示「本环境无法判定」，绝不冒充 PASS，只有 FAIL 才红。
      # 想把这一步在 CI 里变成真闸门，需把 dsh-patrol 一并 checkout 到 workspace 的 ../dsh-patrol
      # （例如再加一个 actions/checkout 并用 with.path: ../dsh-patrol）。
      - name: Item contract parity (cross-repo; SKIP when dsh-patrol is absent)
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-item-contract-parity.ps1

      - name: csv-file adapter self-test
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-csv-file-adapter.ps1

      - name: Secret hygiene gate
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-no-secrets.ps1
