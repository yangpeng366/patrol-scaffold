name: verify

# 门槛只做七件事：描述文件规格漂移、契约自测（每个 provider 过同一把尺子）、csv-file 离线自测、
# command 离线自测（mock 命令，无凭据无网络，CI 可真跑）、跨仓 item 契约同源校验（兄弟仓 dsh-patrol
# 稀疏 checkout 后真跑，不再是 SKIP）、密钥卫生、发布归档自证（内容清单 / 逐条哈希 / 禁入模式 /
# 用户改动排除 / 产物密钥扫描）。
# 除「稀疏 checkout 公开兄弟仓 yangpeng366/dsh-patrol 的 schemas/」这一条取数动作外，全部离线：
# 不装依赖、不跑网络用例、不需要任何 secret（公开仓用默认 GITHUB_TOKEN 即可）。

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: pwsh gates (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 保持仓库原样换行，避免 CSV 与源码被 autocrlf 改写后与本地不一致
          fetch-depth: 1

      - name: Show PowerShell version
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          $PSVersionTable.PSEdition

      - name: Adapter spec drift check
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-adapter-spec.ps1

      - name: Adapter contract test (all providers)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/adapter-contract-test.ps1

      # 跨仓同源校验（真闸门）：本仓 schemas/item.schema.json 与 dsh-patrol/schemas/item.schema.json
      # 必须逐键等价（比较口径见 tests/verify-item-contract-parity.ps1 文件头）。
      #
      # 旧版本这里只 checkout 了 patrol-scaffold 一个仓，脚本默认查找的 ../dsh-patrol/schemas/
      # item.schema.json 在 CI 上必然不存在，于是这步永远打印 SKIP 并 exit 0——闸门形同虚设。
      # 现在改为：先把兄弟仓 yangpeng366/dsh-patrol 稀疏 checkout 到 workspace 内的 dsh-patrol/
      # （只取 schemas，fetch-depth 1），再用显式 -OtherSchema 指过去。显式给路就一定要读到文件，
      # 读不到直接 FAIL（脚本对「显式指路指空」判红，不再退化成 SKIP），所以 CI 上它是真闸门。
      # 公开仓用默认 GITHUB_TOKEN、不需要新增 secret；除这次 checkout 外不联网、离线可复跑：
      # 本机等价命令 pwsh -NoProfile -File tests/verify-item-contract-parity.ps1 `
      #   -OtherSchema <dsh-patrol 克隆目录>/schemas/item.schema.json
      - name: Checkout dsh-patrol schema (cross-repo gate input)
        uses: actions/checkout@v4
        with:
          repository: yangpeng366/dsh-patrol
          path: dsh-patrol
          sparse-checkout: schemas
          fetch-depth: 1

      - name: Item contract parity (cross-repo; real gate)
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-item-contract-parity.ps1 -OtherSchema ./dsh-patrol/schemas/item.schema.json

      - name: csv-file adapter self-test
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-csv-file-adapter.ps1

      # command 适配器的离线自测：fixture 是仓内 mock 命令（不联网、不读凭据、输出确定性），
      # 所以这条在 CI 上是真跑而不是 SKIP。它同时断言负面分支（退出码 / 超时 / banner / fieldMap 拼错）
      # 与「与 local-json 归一后 item 形状一致」。
      - name: command adapter self-test
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-command-adapter.ps1

      - name: Secret hygiene gate
        shell: pwsh
        run: pwsh -NoProfile -File tests/verify-no-secrets.ps1

      # 发布归档自证：打包不是重点，「归档内容是清单的逐字节副本」才是。脚本会重开 zip 验
      # 条目集合 / 逐条 SHA256 / 禁入模式（.git、state、downloads、reports、*.zip、临时文件）/
      # VERSION 与 CHANGELOG 一致 / sample-tasks.json == HEAD blob / 解包后再跑一遍密钥卫生。
      # 归档写到 RUNNER_TEMP，不进工作树；clean checkout 下无需 -IncludeUntracked。
      - name: Release archive (build + self-verify)
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP 'release'
          pwsh -NoProfile -File scripts/build-release.ps1 -OutputDirectory $releaseDir
